<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bring Back MCSM!</title>

  <!-- Minecraft Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)),
        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cmVjdCB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIGZpbGw9IiMxYTFhMWEiLz48cmVjdCB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIGZpbGw9IiMyYzJjMmMiLz48cmVjdCB4PSIyMCIgeT0iMjAiIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iIzJjMmMyYyIvPjwvc3ZnPg==');
      color: #ffffff;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* --- MCSM Header --- */
    .mcsm-header {
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.8);
      border: 4px solid #8b8b8b;
      padding: 15px 25px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mcsm-header .title {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: #ffff55;
      text-shadow: 3px 3px 0 #3f3f3f;
    }

    .mcsm-header .votes {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #aaaaaa;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 15px;
      border: 2px solid #555;
    }

    .mcsm-header .votes span {
      color: #55ff55;
    }

    /* --- Container --- */
    .container {
      max-width: 900px;
      width: 100%;
    }

    /* --- Hero Image --- */
    .hero-image {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border: 4px solid #8b8b8b;
      display: block;
      background: #111;
      margin-bottom: 25px;
    }

    /* --- Vote Section --- */
    .vote-section {
      background: rgba(0, 0, 0, 0.8);
      border: 4px solid #8b8b8b;
      padding: 35px;
      text-align: center;
      margin-bottom: 25px;
    }

    .vote-section h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.2rem;
      color: #ffff55;
      text-shadow: 3px 3px 0 #3f3f3f;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .vote-number {
      font-family: 'Press Start 2P', monospace;
      font-size: 3.5rem;
      color: #55ff55;
      text-shadow: 3px 3px 0 #1a5a1a;
      margin: 10px 0;
    }

    .vote-goal {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #aaaaaa;
      display: block;
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #1a1a1a;
      border: 3px solid #555;
      margin: 15px 0 25px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #55ff55, #ffff55);
      transition: width 0.5s ease;
      box-shadow: 0 0 30px rgba(85, 255, 85, 0.2);
    }

    .vote-button {
      background: #2d2d2d;
      border: 4px solid #8b8b8b;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      padding: 20px 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 2px 2px 0 #000;
      width: 100%;
      max-width: 500px;
    }

    .vote-button:hover:not(:disabled) {
      border-color: #ffff55;
      color: #ffff55;
      background: rgba(255, 255, 85, 0.05);
      box-shadow: 0 0 40px rgba(255, 255, 85, 0.1);
    }

    .vote-button:disabled {
      border-color: #555;
      color: #666;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .vote-status {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: #888;
      margin-top: 15px;
      min-height: 30px;
    }

    .vote-status.success {
      color: #55ff55;
    }

    .vote-status.warning {
      color: #ffff55;
    }

    .vote-status.error {
      color: #ff5555;
    }

    /* --- Gallery --- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }

    .gallery-card {
      background: rgba(0, 0, 0, 0.8);
      border: 4px solid #8b8b8b;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .gallery-card:hover {
      border-color: #ffff55;
      transform: translateY(-3px);
    }

    .gallery-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* --- Footer --- */
    .footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      border-top: 4px solid #8b8b8b;
      width: 100%;
    }

    .footer p {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #555;
      letter-spacing: 1px;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .hero-image {
        height: 220px;
      }

      .vote-section h2 {
        font-size: 0.9rem;
      }

      .vote-number {
        font-size: 2.5rem;
      }

      .vote-button {
        font-size: 0.8rem;
        padding: 16px 20px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .mcsm-header .title {
        font-size: 0.7rem;
      }

      .mcsm-header .votes {
        font-size: 0.55rem;
        padding: 5px 10px;
      }
    }

    @media (max-width: 480px) {
      .hero-image {
        height: 160px;
      }

      .vote-number {
        font-size: 1.8rem;
      }

      .vote-button {
        font-size: 0.65rem;
        padding: 14px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- MCSM Header -->
  <div class="mcsm-header">
    <div class="title">BRING BACK MCSM</div>
    <div class="votes">SUPPORTERS: <span id="headerVotes">...</span></div>
  </div>

  <div class="container">

    <!-- Hero Image -->
    <img class="hero-image" 
         src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9i7v8LrosnCQsrNgknWv440-id56oomDWyx8fvYWzig&s=10" 
         alt="Minecraft Story Mode"
         onerror="this.style.display='none'">

    <!-- Vote Section -->
    <div class="vote-section">
      <h2>THE ORDER NEEDS YOU</h2>
      
      <div class="vote-number" id="voteNumber">...</div>
      <span class="vote-goal">GOAL: 100,000 SUPPORTERS</span>
      
      <div class="progress-bar">
        <div class="fill" id="progressFill" style="width: 0%"></div>
      </div>

      <button class="vote-button" id="voteBtn" onclick="registerVote()">
        BRING BACK STORY MODE
      </button>
      <div class="vote-status" id="voteStatus">Click to support the Order of the Stone</div>
    </div>

    <!-- Gallery -->
    <div class="gallery">
      <div class="gallery-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6I9P1tl5RxJIVQ7CrMddlT_cRyIOQ0wVIvHQyJKqrwg&s=10" 
             alt="Jesse and friends"
             onerror="this.style.display='none'">
      </div>

      <div class="gallery-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQinAhIX0h4B4tBHUsNN68YO5szKSpZ-70sRHYg-x1Isw&s=10" 
             alt="Reuben and the gang"
             onerror="this.style.display='none'">
      </div>

      <div class="gallery-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQ1kp1oa3AXPLJc1lrMBd7ZfSxpHv-7vfoh393NDZySw&s=10" 
             alt="Jesse in armor"
             onerror="this.style.display='none'">
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>MINECRAFT STORY MODE - THE ORDER OF THE STONE</p>
    </div>

  </div>

  <script>
    // --- GLOBAL VOTE SYSTEM - CLOUD ONLY ---
    
    // Primary API: CounterAPI (free, reliable)
    const COUNTER_API = 'https://api.counterapi.dev/v1/mcsm_campaign/votes';
    
    // Backup API: CountAPI
    const BACKUP_API = 'https://api.countapi.xyz/hit/mcsm_campaign/votes';
    
    const VOTED_KEY = 'mcsm_user_voted';
    
    let currentVotes = 0;
    let isVoting = false;
    
    const voteNumber = document.getElementById('voteNumber');
    const headerVotes = document.getElementById('headerVotes');
    const progressFill = document.getElementById('progressFill');
    const voteBtn = document.getElementById('voteBtn');
    const voteStatus = document.getElementById('voteStatus');

    function hasUserVoted() {
      try {
        return localStorage.getItem(VOTED_KEY) === 'true';
      } catch {
        return false;
      }
    }

    function setUserVoted() {
      try {
        localStorage.setItem(VOTED_KEY, 'true');
      } catch {}
    }

    // Load votes from cloud API
    async function loadVotes() {
      try {
        // Try primary API first
        const response = await fetch(COUNTER_API);
        if (response.ok) {
          const data = await response.json();
          currentVotes = data.count;
          updateUI(currentVotes);
          return;
        }
      } catch (e) {
        console.log('Primary API failed, trying backup...');
      }

      // Try backup API
      try {
        const response = await fetch(BACKUP_API);
        if (response.ok) {
          const data = await response.json();
          currentVotes = data.value || 14300;
          updateUI(currentVotes);
          return;
        }
      } catch (e) {
        console.log('Backup API failed');
      }

      // If both APIs fail, show error
      voteStatus.textContent = 'UNABLE TO LOAD VOTES - PLEASE REFRESH';
      voteStatus.className = 'vote-status error';
      voteNumber.textContent = '???';
      headerVotes.textContent = '???';
    }

    // Register vote using cloud API
    async function registerVote() {
      if (isVoting) return;
      
      if (hasUserVoted()) {
        voteStatus.textContent = 'YOU HAVE ALREADY SUPPORTED THE ORDER';
        voteStatus.className = 'vote-status warning';
        return;
      }

      isVoting = true;
      voteBtn.disabled = true;
      voteBtn.textContent = 'SAVING...';
      voteStatus.textContent = 'RECORDING YOUR SUPPORT...';
      voteStatus.className = 'vote-status';

      let success = false;
      let apiUsed = '';

      // Try primary API
      try {
        const response = await fetch(`${COUNTER_API}/up`, { method: 'POST' });
        if (response.ok) {
          const data = await response.json();
          currentVotes = data.count;
          success = true;
          apiUsed = 'CounterAPI';
        }
      } catch (e) {
        console.log('Primary API vote failed, trying backup...');
      }

      // If primary failed, try backup API
      if (!success) {
        try {
          const response = await fetch(BACKUP_API, { method: 'POST' });
          if (response.ok) {
            const data = await response.json();
            currentVotes = data.value || currentVotes + 1;
            success = true;
            apiUsed = 'CountAPI';
          }
        } catch (e) {
          console.log('Backup API vote failed');
        }
      }

      // If both APIs fail
      if (!success) {
        voteBtn.disabled = false;
        voteBtn.textContent = 'BRING BACK STORY MODE';
        voteStatus.textContent = 'VOTE FAILED - PLEASE TRY AGAIN LATER';
        voteStatus.className = 'vote-status error';
        isVoting = false;
        return;
      }

      // Vote successful
      setUserVoted();
      updateUI(currentVotes);
      
      voteBtn.textContent = 'THE ORDER REMEMBERS';
      voteBtn.disabled = true;
      voteStatus.textContent = 'YOUR SUPPORT HAS BEEN RECORDED';
      voteStatus.className = 'vote-status success';
      
      isVoting = false;
    }

    function updateUI(count) {
      const formatted = count.toLocaleString();
      voteNumber.textContent = formatted;
      headerVotes.textContent = formatted;
      
      const percentage = Math.min((count / 100000) * 100, 100);
      progressFill.style.width = percentage + '%';
      
      if (hasUserVoted()) {
        voteBtn.textContent = 'THE ORDER REMEMBERS';
        voteBtn.disabled = true;
        voteStatus.textContent = 'YOU HAVE ALREADY SUPPORTED THE ORDER';
        voteStatus.className = 'vote-status success';
      }
    }

    // Auto-refresh votes from cloud
    let refreshInterval;

    function startAutoRefresh() {
      refreshInterval = setInterval(async () => {
        try {
          const response = await fetch(COUNTER_API);
          if (response.ok) {
            const data = await response.json();
            currentVotes = data.count;
            updateUI(currentVotes);
          }
        } catch (e) {
          // Try backup
          try {
            const response = await fetch(BACKUP_API);
            if (response.ok) {
              const data = await response.json();
              currentVotes = data.value || currentVotes;
              updateUI(currentVotes);
            }
          } catch (e) {}
        }
      }, 15000);
    }

    // Init
    document.addEventListener('DOMContentLoaded', async function() {
      await loadVotes();
      startAutoRefresh();
    });

    window.addEventListener('beforeunload', function() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });

    console.log('MCSM CAMPAIGN - CLOUD VOTE SYSTEM ACTIVE');
    console.log('Votes are saved in the cloud for everyone to see');
    console.log('Help us reach 100,000 and bring back MCSM');
  </script>
</body>
</html>
